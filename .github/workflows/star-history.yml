name: star history

# Regenerate assets/star-history.svg from our own stargazer timestamps and open a
# PR with it. Never pushes to main directly — the chart is cosmetic, so it can
# wait for a human to merge.
#
# It runs HERE, with a repo token, because since 2026-06-30 the stargazers
# endpoint is limited to a repo's admins and collaborators: a hosted chart
# service is neither, so third-party embeds now render a "GitHub restricted
# access to star data" notice instead of a chart.
#
# STAR_TOKEN is NOT required. The chart is built from assets/star-history.json,
# which the run appends to using the repo object's stargazers_count -- public,
# unauthenticated, unaffected by the 2026-06-30 /stargazers restriction.
#
# A token only buys BACKFILL of history from before that file existed, and a
# fine-grained PAT cannot do it at any permission level: the endpoint wants an
# admin or collaborator, which means a classic PAT or a user login. Not worth a
# broad credential in CI for a cosmetic chart -- backfill once from a laptop
# instead:  python3 scripts/gen-star-history.py --seed
on:
  schedule:
    - cron: '20 4 * * *'      # daily, 04:20 UTC
  workflow_dispatch:

concurrency:
  group: star-history
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the chart
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen-star-history.py

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The generator writes nothing on a flat day, so on a quiet day this
          # exits here and no PR is touched. Both files matter: the JSON is the
          # accumulated history and the SVG is rendered from it.
          if git diff --quiet -- assets/star-history.json assets/star-history.svg; then
            echo "no change — nothing to open"
            exit 0
          fi

          BRANCH=chore/star-history
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, reset each run: the chart is generated, so its
          # history is noise and a stack of daily branches would be worse.
          git checkout -B "$BRANCH"
          # The JSON MUST be committed: it is the history. Committing only the
          # SVG would discard every accumulated count and the chart could never
          # grow past a single day.
          git add assets/star-history.json assets/star-history.svg
          git commit -m "chore(assets): refresh star history chart"
          git push --force origin "$BRANCH"

          TOTALS=$(python3 - <<'PY'
          import re
          s = open("assets/star-history.svg", encoding="utf-8").read()
          print(", ".join(f"{r} {n}" for r, n in re.findall(r'>([\w.-]+/[\w.-]+) <tspan[^>]*>\((\d+)\)', s)) or "updated")
          PY
          )

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open — the force-push above updated it"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(assets): refresh star history chart" \
              --body "Regenerated by \`.github/workflows/star-history.yml\`.

          Current totals: **${TOTALS}**

          Only \`assets/star-history.svg\` changes. Safe to merge or close — the next
          run reopens it if the numbers move again."
          fi
