name: Telegram notify

# Posts to the MoaV Telegram channel on:
#   • a published GitHub Release  → title + notes excerpt + links
#   • an issue labeled ANNOUNCE_LABEL → title + link (not every issue)
#   • manual dispatch             → a test message
# Requires repo secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID; if either is
# unset the send is skipped cleanly (no failed runs on forks).
# Optional TELEGRAM_TOPIC_ID: when the chat is a forum supergroup, set this to
# the target topic's thread id to post into that topic (e.g. the "github logs"
# topic). Unset = posts to the group's General topic, as before.

on:
  release:
    types: [published]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Send a REAL release notification for this tag (e.g. v1.9.1) — test against a past release. Blank = send the plain test text below.'
        default: ''
      text:
        description: 'Plain test message (used only when release_tag is blank)'
        default: 'MoaV Telegram notifier test ✅'

permissions:
  contents: read

env:
  ANNOUNCE_LABEL: announce     # only issues with THIS label are posted
  PRODUCT: MoaV                # label releases in the shared channel

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build message
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ANNOUNCE_LABEL: ${{ env.ANNOUNCE_LABEL }}
          LABEL_ADDED: ${{ github.event.label.name }}
          REL_NAME: ${{ github.event.release.name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          REL_URL: ${{ github.event.release.html_url }}
          REL_BODY: ${{ github.event.release.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          DISPATCH_TEXT: ${{ github.event.inputs.text }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          # Manual test against a real (e.g. previous) release: fetch it and
          # format it exactly like the automatic release notification.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$RELEASE_TAG_INPUT" ]; then
            echo "Fetching release $RELEASE_TAG_INPUT for a test notification…"
            gh api "repos/${REPO}/releases/tags/${RELEASE_TAG_INPUT}" > release.json
            export EVENT=release
            REL_NAME=$(jq -r '.name // .tag_name' release.json); export REL_NAME
            REL_TAG=$(jq -r '.tag_name'           release.json); export REL_TAG
            REL_URL=$(jq -r '.html_url'           release.json); export REL_URL
            REL_BODY=$(jq -r '.body // ""'        release.json); export REL_BODY
          fi
          python3 .github/scripts/telegram_format.py > message.txt

          # Pin the link preview to OUR page (release/issue), never an external
          # link that happens to appear first in the notes body — Telegram
          # previews the first URL otherwise, so an App Store link in the client
          # table was winning the card. Empty = the plain test, no preview.
          PREVIEW_URL=""
          case "$EVENT" in
            release) PREVIEW_URL="$REL_URL" ;;
            issues)  [ -s message.txt ] && PREVIEW_URL="$ISSUE_URL" ;;
          esac
          printf '%s' "$PREVIEW_URL" > preview_url.txt

      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          if [ ! -s message.txt ]; then
            echo "Nothing to announce for this event — skipping."; exit 0
          fi
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping send."; exit 0
          fi
          # Optional: target a specific forum-supergroup topic (e.g. "github logs").
          EXTRA=()
          if [ -n "${TOPIC_ID}" ]; then EXTRA=(--data-urlencode "message_thread_id=${TOPIC_ID}"); fi
          # Force the preview to our own page (release/issue). Falls back to no
          # preview for the plain test. link_preview_options needs Bot API >= 7.0.
          PREVIEW_URL="$(cat preview_url.txt 2>/dev/null || true)"
          if [ -n "$PREVIEW_URL" ]; then
            LPO="$(jq -cn --arg u "$PREVIEW_URL" '{url:$u, prefer_large_media:false}')"
          else
            LPO='{"is_disabled":true}'
          fi
          echo "Sending $(wc -c < message.txt) bytes to Telegram${TOPIC_ID:+ (topic $TOPIC_ID)}…"
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            "${EXTRA[@]}" \
            --data-urlencode "text@message.txt" \
            -d parse_mode=HTML \
            --data-urlencode "link_preview_options=${LPO}" \
            -o /dev/null
          echo "Sent."
