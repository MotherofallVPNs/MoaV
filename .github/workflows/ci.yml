name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-bash:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List shell scripts
        id: files
        run: |
          files=$(git ls-files '*.sh' 'moav.sh' | sort -u)
          echo "count=$(echo "$files" | wc -l)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$files" > /tmp/shfiles
      - name: bash -n (parse check)
        run: |
          rc=0
          while IFS= read -r f; do
            # Only parse-check bash scripts; some entrypoints are POSIX sh
            head -1 "$f" | grep -qE 'bash' && { bash -n "$f" || rc=1; }
          done < /tmp/shfiles
          exit $rc
      - name: shellcheck (severity=error)
        run: xargs shellcheck --severity=error < /tmp/shfiles
      - name: share-link golden test
        run: bash tests/singbox-links-test.sh
      - name: peer-IP allocator unit test
        run: bash tests/net-alloc-test.sh
      - name: strict-mode regression test
        run: bash tests/strict-mode-test.sh
      - name: state key permission test
        run: bash tests/state-perms-test.sh
      - name: user-add timeout + wg dedup test
        run: bash tests/user-add-timeout-test.sh
      - name: bundle permission test
        run: bash tests/bundle-perms-test.sh
      - name: entrypoint strict-mode test
        run: bash tests/entrypoint-strict-test.sh
      - name: sing-box state read-only (no key-ownership downgrade)
        run: bash tests/singbox-state-readonly-test.sh
      - name: wg/awg keygen fallback (local image, not lscr.io)
        run: bash tests/wg-keygen-fallback-test.sh
      - name: user UUID capture (no two-line double-capture)
        run: bash tests/uuid-capture-test.sh
      - name: config naming (server label + wg 15-char limit)
        run: bash tests/config-naming-test.sh
      - name: grafana branding non-fatal
        run: bash tests/grafana-branding-test.sh
      - name: env resolution golden-diff
        run: bash tests/env-resolution-test.sh
      - name: env nested-fallback resolution
        run: bash tests/env-fallback-test.sh
      - name: .env.example slim/full split
        run: bash tests/env-example-test.sh
      - name: reality short_id desync guard
        run: bash tests/reality-desync-test.sh
      - name: bundle enabled-only (#73)
        run: bash tests/bundle-enabled-only-test.sh
      - name: docker management-plane isolation
        run: bash tests/network-isolation-test.sh
      - name: monitoring socket removal
        run: bash tests/exporter-socket-test.sh
      - name: sing-box per-user metrics + MahsaNet ads_url
        run: bash tests/singbox-user-metrics-test.sh
      - name: CLI surface consistency (help/links/table/pins)
        run: bash tests/cli-surface-test.sh
      - name: DNS-tunnel bundle completeness
        run: bash tests/dns-tunnel-bundle-test.sh
      - name: user subscription vs bundle-blob distinction
        run: bash tests/user-subscription-test.sh
      - name: bundle guide section visibility (all protocols)
        run: bash tests/bundle-guide-sections-test.sh
      - name: ENABLE_* gating in the user-add paths
        run: bash tests/enable-flag-gating-test.sh
      - name: donate-mode regenerate (missing per-user protocol)
        run: bash tests/donate-regenerate-test.sh
      - name: ENABLE_CDN opt-in flag
        run: bash tests/cdn-flag-test.sh
      - name: CDN survives an upgrade (flag inference + path rotation)
        run: bash tests/cdn-upgrade-test.sh
      - name: llms.txt link hygiene (structure)
        run: bash tests/llms-links-test.sh
      - name: moav update rebuild prompts (baked-in changes)
        run: bash tests/update-rebuild-test.sh
      - name: build cache cap (sizing reaches docker builder)
        run: bash tests/build-cache-test.sh
      - name: monitoring privacy (no user x destination) (#297)
        run: bash tests/monitoring-privacy-test.sh
      - name: site analytics aggregation (#297)
        run: bash tests/sitestats-test.sh
      - name: sing-box country metrics
        run: bash tests/singbox-country-test.sh
      - name: sing-box log scrubbing (#297)
        run: bash tests/singbox-log-scrub-test.sh
      - name: dashboard time-range scoping
        run: bash tests/dashboard-timerange-test.sh
      - name: doctor net drop counters
        run: bash tests/net-drops-test.sh
      - name: snowflake native metrics + dashboard (#183)
        run: bash tests/snowflake-metrics-test.sh
      - name: admin TLS enforcement
        run: bash tests/admin-tls-test.sh
      - name: admin IP whitelist (CIDR) unit test
        run: python3 tests/admin-ip-whitelist-test.py
      - name: refactor verification (static)
        run: bash tests/refactor-verify.sh
      - name: protocol-roster drift gate
        run: python3 scripts/gen-protocol-docs.py --check
      - name: star-history README link + renderer (offline)
        run: python3 scripts/gen-star-history.py --check
      - name: repo charts renderer + README link (offline)
        run: python3 scripts/gen-charts.py --check
      - name: star-history API version + timestamp guard
        run: bash tests/star-history-test.sh
      - name: funding block drift gate (README from FUNDING.yml)
        run: bash scripts/render-funding.sh --check
      - name: FUNDING.yml address values stay quoted
        run: bash tests/funding-yaml-test.sh
      - name: doctor peers --fix (SIGPIPE + volume state)
        run: bash tests/peers-repair-test.sh
      - name: net tuning stale-file + template drift
        run: bash tests/nettune-template-test.sh
      - name: PID-1 reaper on orphan-inheriting containers
        run: bash tests/zombie-reaper-test.sh
      - name: doctor host (load/swap/zombies) + check wiring
        run: bash tests/hostload-test.sh
      - name: release footer generator
        run: bash tests/release-footer-test.sh
      - name: release footer links resolve (network)
        run: bash scripts/render-release-footer.sh --check
      - name: llms.txt links resolve (network)
        run: LLMS_CHECK_URLS=1 bash tests/llms-links-test.sh

  go-test:
    name: go test dns-router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false   # dns-router is stdlib-only (no go.sum to hash)
      - name: go vet
        working-directory: dns-router
        run: go vet ./...
      - name: go test
        working-directory: dns-router
        run: go test -race ./...

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config >/dev/null
