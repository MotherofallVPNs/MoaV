name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-bash:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List shell scripts
        id: files
        run: |
          files=$(git ls-files '*.sh' 'moav.sh' | sort -u)
          echo "count=$(echo "$files" | wc -l)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$files" > /tmp/shfiles
      - name: Install pinned shellcheck
        run: |
          # The runner's preinstalled shellcheck changes with the image; the
          # warning baseline is only valid for one release.
          ver="$(bash scripts/lint-shell.sh --pinned-version)"
          curl -fsSL --retry 3 -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: parse check (bash -n / sh -n)
        run: |
          rc=0
          while IFS= read -r f; do
            # Entrypoints with a #!/bin/sh shebang are POSIX sh: check those with sh.
            if head -1 "$f" | grep -qE 'bash'; then bash -n "$f" || rc=1; else sh -n "$f" || rc=1; fi
          done < /tmp/shfiles
          exit $rc
      - name: shellcheck (severity=error)
        run: xargs shellcheck --severity=error < /tmp/shfiles
      - name: shellcheck (severity=warning, no new findings)
        run: bash scripts/lint-shell.sh
      - name: shell lint gate blocks (self-test)
        run: bash tests/lint-shell-test.sh
      - name: share-link golden test
        run: bash tests/singbox-links-test.sh
      - name: moav:// bundle emitter golden test
        run: bash tests/moav-bundle-test.sh
      - name: peer-IP allocator unit test
        run: bash tests/net-alloc-test.sh
      - name: strict-mode regression test
        run: bash tests/strict-mode-test.sh
      - name: state key permission test
        run: bash tests/state-perms-test.sh
      - name: user-add timeout + wg dedup test
        run: bash tests/user-add-timeout-test.sh
      - name: bundle permission test
        run: bash tests/bundle-perms-test.sh
      - name: user add checks its config writes before provisioning
        run: bash tests/user-add-preflight-test.sh
      - name: entrypoint strict-mode test
        run: bash tests/entrypoint-strict-test.sh
      - name: sing-box state read-only (no key-ownership downgrade)
        run: bash tests/singbox-state-readonly-test.sh
      - name: sing-box config valid JSON + 1.14 compatibility
        run: bash tests/singbox-config-valid-test.sh
      - name: sing-box real-binary check + format (pinned version)
        run: bash tests/singbox-check-test.sh
      - name: egress isolation (private/infra ranges blocked by default)
        run: bash tests/egress-isolation-test.sh
      - name: moav restart applies .env changes (recreate on change)
        run: bash tests/restart-recreate-test.sh
      - name: Snell protocol wiring + add-user
        run: bash tests/snell-test.sh
      - name: wg/awg keygen fallback (local image, not lscr.io)
        run: bash tests/wg-keygen-fallback-test.sh
      - name: user UUID capture (no two-line double-capture)
        run: bash tests/uuid-capture-test.sh
      - name: malformed credentials.env guard
        run: bash tests/creds-valid-test.sh
      - name: config naming (server label + wg 15-char limit)
        run: bash tests/config-naming-test.sh
      - name: grafana branding non-fatal
        run: bash tests/grafana-branding-test.sh
      - name: env resolution golden-diff
        run: bash tests/env-resolution-test.sh
      - name: env nested-fallback resolution
        run: bash tests/env-fallback-test.sh
      - name: .env.example slim/full split
        run: bash tests/env-example-test.sh
      - name: reality short_id desync guard
        run: bash tests/reality-desync-test.sh
      - name: bundle enabled-only (#73)
        run: bash tests/bundle-enabled-only-test.sh
      - name: docker management-plane isolation
        run: bash tests/network-isolation-test.sh
      - name: monitoring socket removal
        run: bash tests/exporter-socket-test.sh
      - name: sing-box per-user metrics + MahsaNet ads_url
        run: bash tests/singbox-user-metrics-test.sh
      - name: CLI surface consistency (help/links/table/pins)
        run: bash tests/cli-surface-test.sh
      - name: DNS-tunnel bundle completeness
        run: bash tests/dns-tunnel-bundle-test.sh
      - name: DNS-tunnel startup gating (dnstt / MasterDNS / XDNS)
        run: bash tests/dns-tunnel-startup-test.sh
      - name: user subscription vs bundle-blob distinction
        run: bash tests/user-subscription-test.sh
      - name: bundle guide section visibility (all protocols)
        run: bash tests/bundle-guide-sections-test.sh
      - name: ENABLE_* gating in the user-add paths
        run: bash tests/enable-flag-gating-test.sh
      - name: donate-mode regenerate (missing per-user protocol)
        run: bash tests/donate-regenerate-test.sh
      - name: donate quota stop + ledger resume
        run: bash tests/donate-quota-resume-test.sh
      - name: ENABLE_CDN opt-in flag
        run: bash tests/cdn-flag-test.sh
      - name: CDN survives an upgrade (flag inference + path rotation)
        run: bash tests/cdn-upgrade-test.sh
      - name: llms.txt link hygiene (structure)
        run: bash tests/llms-links-test.sh
      - name: --json output shapes are valid + secret-free (moav-deploy-app#8)
        run: bash tests/cli-json-test.sh
      - name: install.sh non-interactive answers (fail closed, 0600, no argv password)
        run: bash tests/install-noninteractive-test.sh
      - name: moav update rebuild prompts (baked-in changes)
        run: bash tests/update-rebuild-test.sh
      - name: moav update Discard resets staged + unstaged
        run: bash tests/update-discard-test.sh
      - name: build cache cap (sizing reaches docker builder)
        run: bash tests/build-cache-test.sh
      - name: moav update image cleanup is dangling-only (never -a / --volumes)
        run: bash tests/update-image-prune-test.sh
      - name: moav build --help prints usage, builds nothing
        run: bash tests/build-help-test.sh
      - name: moav build knows every compose profile and service
        run: bash tests/build-profiles-test.sh
      - name: moav apply (build, regenerate, start, cleanup; markers, exit codes, lock)
        run: bash tests/apply-test.sh
      - name: monitoring privacy (no user x destination) (#297)
        run: bash tests/monitoring-privacy-test.sh
      - name: site analytics aggregation (#297)
        run: bash tests/sitestats-test.sh
      - name: sing-box country metrics
        run: bash tests/singbox-country-test.sh
      - name: sing-box log scrubbing (#297)
        run: bash tests/singbox-log-scrub-test.sh
      - name: dashboard time-range scoping
        run: bash tests/dashboard-timerange-test.sh
      - name: doctor net drop counters
        run: bash tests/net-drops-test.sh
      - name: one-shot service classification
        run: bash tests/oneshot-services-test.sh
      - name: wg/awg stored-IP collision
        run: bash tests/wg-ip-collision-test.sh
      - name: AmneziaWG v3 params
        run: bash tests/amneziawg-v3-test.sh
      - name: regenerate-users reloads WG/AWG
        run: bash tests/regenerate-reload-test.sh
      - name: batch/--all revoke resets services once
        run: bash tests/revoke-batch-reload-test.sh
      - name: doctor CDN detection + scrape targets
        run: bash tests/doctor-cdn-test.sh
      - name: snowflake native metrics + dashboard (#183)
        run: bash tests/snowflake-metrics-test.sh
      - name: admin TLS enforcement
        run: bash tests/admin-tls-test.sh
      - name: admin IP whitelist (CIDR) unit test
        run: python3 tests/admin-ip-whitelist-test.py
      - name: admin dashboard renders on the pinned Python deps
        run: |
          python3 -m venv /tmp/admin-venv
          /tmp/admin-venv/bin/pip install -q -r admin/requirements.txt
          /tmp/admin-venv/bin/python tests/admin-dashboard-render-test.py
      - name: MahsaNet donate protocols validation
        run: python3 tests/mahsanet-protocols-test.py
      - name: refactor verification (static)
        run: bash tests/refactor-verify.sh
      - name: protocol-roster drift gate
        run: python3 scripts/gen-protocol-docs.py --check
      - name: star-history README link + renderer (offline)
        run: python3 scripts/gen-star-history.py --check
      - name: repo charts renderer + README link (offline)
        run: python3 scripts/gen-charts.py --check
      - name: star-history API version + timestamp guard
        run: bash tests/star-history-test.sh
      - name: funding block drift gate (README from FUNDING.yml)
        run: bash scripts/render-funding.sh --check
      - name: FUNDING.yml address values stay quoted
        run: bash tests/funding-yaml-test.sh
      - name: doctor peers --fix (SIGPIPE + volume state)
        run: bash tests/peers-repair-test.sh
      - name: net tuning stale-file + template drift
        run: bash tests/nettune-template-test.sh
      - name: PID-1 reaper on orphan-inheriting containers
        run: bash tests/zombie-reaper-test.sh
      - name: doctor host (load/swap/zombies) + check wiring
        run: bash tests/hostload-test.sh
      - name: self-signed TLS note (fresh-install cert warning)
        run: bash tests/tls-note-test.sh
      - name: moav cert (domainless no-op + install idempotency)
        run: bash tests/cert-test.sh
      - name: cert-renew outcome test
        run: bash tests/cert-renew-test.sh
      - name: Prometheus rules file materialized (Docker directory stand-in, root-owned parent)
        run: bash tests/conduit-rules-materialize-test.sh
      - name: moav update -b accepts a tag (release candidate)
        run: bash tests/update-tag-test.sh
      - name: moav update non-interactive (--yes / MOAV_NONINTERACTIVE)
        run: bash tests/update-noninteractive-test.sh
      - name: .env has no inline comments on variable lines
        run: bash tests/env-no-inline-comment-test.sh
      - name: xdns VLESS address is Xray >= 26.9 compliant
        run: bash tests/xdns-xray-compat-test.sh
      - name: release footer generator
        run: bash tests/release-footer-test.sh
      - name: release footer links resolve (network)
        run: bash scripts/render-release-footer.sh --check
      - name: llms.txt links resolve (network)
        run: LLMS_CHECK_URLS=1 bash tests/llms-links-test.sh

  trusttunnel-interop:
    name: TrustTunnel endpoint (H2 + H3 interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pinned endpoint <-> pinned client over HTTP/2 and HTTP/3
        run: bash tests/trusttunnel-interop-test.sh

  go-test:
    name: go test dns-router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
          cache: false   # dns-router is stdlib-only (no go.sum to hash)
      - name: go vet
        working-directory: dns-router
        run: go vet ./...
      - name: go test
        working-directory: dns-router
        run: go test -race ./...

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config >/dev/null
