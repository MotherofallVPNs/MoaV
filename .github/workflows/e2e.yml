name: e2e

# Full end-to-end test: build the stack, bootstrap, start every enabled
# protocol, and run `moav test` (client-test.sh) against the LIVE server.
#
# This is NOT on the per-PR path — it builds ~25 images and needs real TLS
# certs (a domain). It runs on a SELF-HOSTED runner (a test VPS with a test
# domain). Setup + manual-run instructions: docs/devdocs/E2E-TESTING.md
#
# Tiers (workflow_dispatch `tier`; push/release use the default):
#   default — domain mode only (fast). Teardown KEEPS the cert volume, so certbot
#             finds the existing cert and never calls Let's Encrypt. Free to repeat.
#   full    — domain + domainless
#   mega    — domain + domainless + build --local (monitoring from source) + remove images
# `domainless_only: true` overrides the domain portion for a Let's-Encrypt-free run.
#
# COST: full and mega tear down with `uninstall --wipe`, which destroys the cert
# volume, so each spends a Let's Encrypt issuance. LE allows 5 per 168h for the
# same exact domain. Iterate on the default tier or `domainless_only`, and save
# full/mega for the run that matters. The budget check below stops early rather
# than failing at the certbot step twenty minutes in.
# TODO: a future tier (or full+) will also drive a real moav-client connection test.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier'
        type: choice
        default: default
        options:
          - default   # domain mode only (fast path)
          - full      # domain + domainless
          - mega      # domain + domainless + build --local + remove images on uninstall
      verbose:
        description: 'Verbose client-test output (-v)'
        type: boolean
        default: false
      domainless_only:
        description: 'Domainless-only: skip DOMAIN/cert entirely (no Let''s Encrypt, no LE rate-limit hit). Validates IP-only protocols. Overrides the tier''s domain portion.'
        type: boolean
        default: false
      fresh_cert:
        description: 'Force a real Let''s Encrypt issuance: wipe the preserved cert first, then keep the new one. Spends one of the 5/168h. Run when the preserved cert is missing or near expiry.'
        type: boolean
        default: false
  release:
    types: [published]

# Never run two e2e jobs on the same box at once — they share host ports.
concurrency:
  group: e2e-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    # Register a runner on your test VPS with the label `moav-e2e` (see the doc).
    runs-on: [self-hosted, moav-e2e]
    timeout-minutes: 90
    env:
      MOAV_DOMAIN: ${{ secrets.E2E_DOMAIN }}
      MOAV_ACME_EMAIL: ${{ secrets.E2E_ACME_EMAIL }}
      MOAV_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      MOAV_SERVER_IP: ${{ secrets.E2E_SERVER_IP }}
      # Tier + domainless-only, resolved once. Empty on push/release → 'default'
      # (domain-only). See workflow_dispatch inputs above.
      E2E_TIER: ${{ inputs.tier }}
      E2E_DOMAINLESS_ONLY: ${{ inputs.domainless_only }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          # DOMAIN/ACME are only needed for the cert-bearing (domain) run.
          if [ "$E2E_DOMAINLESS_ONLY" != "true" ]; then
            test -n "$MOAV_DOMAIN"          || { echo "::error::secret E2E_DOMAIN is not set"; exit 1; }
            test -n "$MOAV_ACME_EMAIL"      || { echo "::error::secret E2E_ACME_EMAIL is not set"; exit 1; }
          fi
          test -n "$MOAV_ADMIN_PASSWORD"  || { echo "::error::secret E2E_ADMIN_PASSWORD is not set"; exit 1; }
          docker --version && docker compose version
          # Tooling the SUITE needs (not MoaV runtime prerequisites): qrencode for
          # bundle QR codes, zip/unzip for `moav user add --package` and the smoke
          # assertion that inspects the produced archive. Ensure them here — a
          # missing tool must never become a silently skipped test.
          missing=""
          for t in zip unzip qrencode; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ]; then
            echo "Installing missing test tooling:$missing"
            sudo apt-get update -qq && sudo apt-get install -y -qq $missing
          fi
          for t in zip unzip qrencode; do
            command -v "$t" >/dev/null 2>&1 \
              || { echo "::error::$t is required by the e2e suite and could not be installed"; exit 1; }
          done
          echo "suite tooling: zip=$(command -v zip) unzip=$(command -v unzip) qrencode=$(command -v qrencode)"
          # WG/AWG live-tunnel tests need TUN passed into the test container.
          # Without it they silently degrade to config checks (that is exactly
          # how WireGuard "passed" on a DNS resolve for months) — so hard-fail.
          test -c /dev/net/tun \
            || { echo "::error::/dev/net/tun missing on the runner — WG/AWG live tests need it"; exit 1; }

      - name: Let's Encrypt budget check
        # full/mega wipe the cert volume, so this run WILL request a certificate.
        # LE allows 5 per 168h per exact identifier set, and without this the
        # failure surfaces ~20 minutes in at the certbot step. crt.sh is a public
        # certificate-transparency log: no credentials, and it discloses nothing
        # that is not already public by design.
        if: (inputs.tier == 'full' || inputs.tier == 'mega') && inputs.domainless_only != true
        run: |
          set -uo pipefail
          if [ -z "${MOAV_DOMAIN:-}" ]; then echo "no DOMAIN configured; skipping"; exit 0; fi
                    issued=$(curl -sf --max-time 20 "https://crt.sh/?identity=${MOAV_DOMAIN}&exclude=expired&output=json" | python3 -c 'import json,sys,datetime as d; rows=json.load(sys.stdin); cut=d.datetime.now(d.UTC)-d.timedelta(hours=168); print(sum(1 for r in rows if "Encrypt" in (r.get("issuer_name") or "") and d.datetime.fromisoformat(r["entry_timestamp"]).replace(tzinfo=d.UTC)>cut))' 2>/dev/null) || issued=""
          if [ -z "$issued" ]; then echo "::notice::crt.sh unreadable — proceeding without a budget check"; exit 0; fi
          echo "Let's Encrypt certificates for this domain in the last 168h: $issued of 5"
          if [ "$issued" -ge 5 ]; then
            echo "::error::Let's Encrypt budget is spent ($issued/5 in the last 168h)."
            echo "::error::This run would fail at the certbot step. Use the default tier,"
            echo "::error::which reuses the existing cert and costs nothing, or domainless_only."
            exit 1
          fi
          if [ "$issued" -ge 4 ]; then echo "::warning::only $((5 - issued)) issuance(s) left this week"; fi

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=${MOAV_ADMIN_PASSWORD}|" .env
          [ -n "$MOAV_SERVER_IP" ] && sed -i "s|^SERVER_IP=.*|SERVER_IP=${MOAV_SERVER_IP}|" .env
          if [ "$E2E_DOMAINLESS_ONLY" = "true" ]; then
            # No DOMAIN → certbot self-skips (no LE cert, no rate-limit hit).
            # Disable protocols that need a domain cert or DNS delegation so
            # their services don't crash-loop without one.
            sed -i "s|^DOMAIN=.*|DOMAIN=|" .env
            for p in TROJAN ANYTLS HYSTERIA2 DNSTT SLIPSTREAM MASTERDNS TRUSTTUNNEL XDNS; do
              sed -i "s|^ENABLE_${p}=.*|ENABLE_${p}=false|" .env
            done
          else
            sed -i "s|^DOMAIN=.*|DOMAIN=${MOAV_DOMAIN}|"             .env
            sed -i "s|^ACME_EMAIL=.*|ACME_EMAIL=${MOAV_ACME_EMAIL}|" .env
            # AnyTLS is on for the domain pass. The earlier failure (PR #203) was a
            # STATE-REUSE artifact, not a provisioning bug: the default tier does not
            # wipe the state volume, so a stale .bootstrapped made bootstrap skip config
            # regeneration and the anytls inbound was never added. The template renders
            # valid with AnyTLS on (verified), full/mega wipe state first, and the
            # hollow-run guard now fails a run that tests nothing.
            sed -i "s|^ENABLE_ANYTLS=.*|ENABLE_ANYTLS=true|" .env
          fi
          # INITIAL_USERS is a COUNT (not a name) — 1 creates the 'demouser'.
          # We add a named 'e2e-test' user after start (also exercises `user add`).
          grep -q '^INITIAL_USERS=' .env && sed -i "s|^INITIAL_USERS=.*|INITIAL_USERS=1|" .env || echo "INITIAL_USERS=1" >> .env
          grep -q '^DEFAULT_PROFILES=' .env && sed -i "s|^DEFAULT_PROFILES=.*|DEFAULT_PROFILES=all|" .env || echo "DEFAULT_PROFILES=all" >> .env
          # Snell is off by default; enable it so e2e exercises the inbound,
          # provisioning, bundle, and the client-test reachability check.
          sed -i "s|^ENABLE_SNELL=.*|ENABLE_SNELL=true|" .env

      - name: Build images
        run: ./moav.sh build

      - name: Build monitoring images from source (mega only)
        if: inputs.tier == 'mega'
        run: ./moav.sh build --local

      - name: Clean slate (domainless / full / mega — start fresh, ignore prior state)
        if: inputs.domainless_only || inputs.tier == 'full' || inputs.tier == 'mega'
        run: |
          # Run-to-run coupling lives in the VOLUMES (moav_state keeps .bootstrapped
          # + keys, so re-bootstrap skips regenerating host configs). Drop them so
          # bootstrap runs first-time and rebuilds configs from the checkout-restored
          # templates. Do NOT rm configs/ — it holds repo-tracked *.template files.
          #
          # The cert volume is the exception: Let's Encrypt allows only 5 issuances
          # per 168h for the same domain, and wiping it every full/mega run burned
          # through that. It is PRESERVED and the cert reused, unless fresh_cert is
          # set (forces a real issuance) or this is a domainless run (no cert exists).
          if [ "${{ inputs.fresh_cert }}" = "true" ] || [ "${{ inputs.domainless_only }}" = "true" ]; then
            docker compose --profile all down -v --remove-orphans 2>/dev/null || true
          else
            docker compose --profile all down --remove-orphans 2>/dev/null || true
            proj="$(grep -E '^COMPOSE_PROJECT_NAME=' .env | cut -d= -f2)"; proj="${proj:-moav}"
            docker volume ls -q --filter "name=^${proj}_" | grep -v '_certs$' \
              | xargs -r docker volume rm 2>/dev/null || true
            echo "cert volume preserved (${proj}_*_certs); state and other volumes dropped"
          fi

      - name: Bootstrap (keys, certs, first user)
        # --yes: non-interactive; also proceeds if a previous run left state
        # behind (re-bootstrap is idempotent — keeps keys/users, regenerates
        # configs). Without it, a re-run prompts and cancels with no TTY.
        run: ./moav.sh bootstrap --yes

      - name: Start services
        run: ./moav.sh start all

      - name: Diagnostics on failure
        # compose-up only surfaces container lifecycle, not a service's own logs.
        # certbot exiting 1 (LE issuance/renewal) is the common start failure, so
        # dump its logs + the stack status to make the real reason visible.
        if: failure()
        run: |
          echo "== certbot logs =="
          docker compose logs --no-color certbot 2>&1 | tail -80 || true
          echo "== container status =="
          docker compose --profile all ps 2>&1 || true

      - name: Let services settle
        run: sleep 45

      - name: Assert every long-lived service is actually RUNNING
        run: |
          # `docker compose ps` previously appeared ONLY in the failure-diagnostics
          # step, so nothing checked container health on a green path: a service
          # that crash-looped at startup went unnoticed, because the protocol
          # tests can still pass (and WG/AWG warn without a kernel module either
          # way). This matters most for the entrypoints — a bad `set -euo
          # pipefail` change kills a container instantly and silently.
          echo "::group::container states"
          docker ps -a --filter 'name=^moav-' --format '{{.Names}}\t{{.State}}\t{{.Status}}'
          echo "::endgroup::"
          # The one-shot set is DERIVED from docker-compose.yml, not listed here.
          # A hand-kept list drifts: geoip-updater was added later and this step
          # then failed the whole e2e because a job that correctly exits 0 was
          # read as a dead service. Absence of a restart policy is what makes a
          # service one-shot, so ask the compose file.
          python3 -c 'import yaml; d=yaml.safe_load(open("docker-compose.yml"))["services"]; print("\n".join("moav-"+n for n,v in sorted(d.items()) if v.get("restart") is None))' > /tmp/oneshot.txt
          echo "::group::one-shot services (exiting is correct)"; cat /tmp/oneshot.txt; echo "::endgroup::"

          bad=0
          while IFS=$'\t' read -r name state status exitcode; do
            [ -n "$name" ] || continue
            if grep -qxF "$name" /tmp/oneshot.txt; then
              # Exiting is correct, but exiting NON-ZERO never is.
              if [ "$state" != "running" ] && [ "${exitcode:-0}" != "0" ]; then
                echo "::error::$name is a one-shot job that failed (exit $exitcode: $status)"; bad=1
              fi
              continue
            fi
            case "$state" in
              running) ;;
              restarting) echo "::error::$name is RESTARTING ($status) — crash loop"; bad=1 ;;
              *)          echo "::error::$name is $state ($status) — expected running"; bad=1 ;;
            esac
          done < <(docker ps -a --filter 'name=^moav-' --format '{{.Names}}\t{{.State}}\t{{.Status}}\t{{.ExitCode}}')
          if [ "$bad" -ne 0 ]; then
            echo "--- logs from the failed container(s) ---"
            docker ps -a --filter 'name=^moav-' --format '{{.Names}}\t{{.State}}\t{{.ExitCode}}' \
              | awk -F'\t' '$2!="running" && $3!="0"{print $1}' \
              | while read -r c; do echo "::group::$c"; docker logs --tail 30 "$c" 2>&1; echo "::endgroup::"; done
            exit 1
          fi
          echo "All long-lived moav-* containers are running."

      - name: Reclaim config/state ownership for the host CLI
        run: |
          # build/bootstrap/start containers run as root and write configs/,
          # state/, outputs/ root-owned. The host-side CLI (moav user add/test)
          # runs as the non-root runner user, which then can't read them
          # ("Skipping sing-box (not configured)"). Reclaim ownership so the CLI
          # works — the same access a root operator gets for free.
          sudo chown -R "$(id -u):$(id -g)" configs state outputs 2>/dev/null || true

      - name: Provision test user (exercises `moav user add` + `revoke`)
        run: |
          # A previous run may have left the user behind (state is preserved for
          # cert reuse; re-bootstrap even regenerates its bundle). Revoke first
          # so `user add` runs cleanly — this also exercises the revoke path.
          ./moav.sh user revoke e2e-test 2>/dev/null || true
          ./moav.sh user add e2e-test
          test -d outputs/bundles/e2e-test \
            || { echo "::error::user add did not produce outputs/bundles/e2e-test"; exit 1; }
          # Require real protocol configs, not just the always-present README.html
          # and subscription.txt — an empty bundle means provisioning silently
          # skipped everything. subscription.txt is EXCLUDED here on purpose: it is
          # emitted unconditionally (A5), so counting it let a config-less bundle
          # (README + subscription only) pass with n=1 while every protocol test
          # then skipped. That is exactly how a hollow run slipped through.
          n=$(find outputs/bundles/e2e-test -maxdepth 1 -type f \
                ! -name 'README.html' ! -name 'subscription.txt' 2>/dev/null | wc -l)
          echo "bundle has $n protocol config file(s):"; ls -1 outputs/bundles/e2e-test || true
          [ "$n" -ge 1 ] || { echo "::error::user add produced no protocol configs (only README.html/subscription.txt) — provisioning skipped every protocol"; exit 1; }
          # #220 regression: the AmneziaWG/WireGuard adds must COMPLETE (every
          # container call now has a deadline — a wedged exec used to freeze
          # `user add` forever) AND produce their client configs when enabled.
          # Configs are named moav-<server>-awg.conf / -wg.conf (clients take the
          # tunnel name from the filename); the plain names are what pre-rename
          # bundles used. Accept either so this asserts "a config was produced",
          # not "a particular filename spelling".
          _have() { compgen -G "outputs/bundles/e2e-test/$1" >/dev/null; }
          if grep -qE '^ENABLE_AMNEZIAWG=true' .env; then
            _have 'moav-*-awg.conf' || _have 'amneziawg.conf' \
              || { echo "::error::AmneziaWG enabled but user add produced no AmneziaWG config (#220 regression)"; exit 1; }
          fi
          if grep -qE '^ENABLE_WIREGUARD=true' .env; then
            _have 'moav-*-wg.conf' || _have 'wireguard.conf' \
              || { echo "::error::WireGuard enabled but user add produced no WireGuard config"; exit 1; }
          fi

      - name: Regression — added user survives a re-bootstrap (orphan guard)
        run: |
          # THE orphan bug (1.9.1): bootstrap regenerates sing-box/xray from
          # templates, wiping users that `moav user add` inserted incrementally;
          # the reconcile (lib/sync.sh) must re-insert every one. Force a
          # re-bootstrap — exactly what `moav update` does — then assert e2e-test
          # still resolves in the proxy configs BEFORE connectivity runs, so a
          # re-orphaning regression fails loudly here and the connectivity test
          # below validates the reconciled config end-to-end.
          docker run --rm -v moav_moav_state:/state alpine rm -f /state/.bootstrapped
          docker compose --profile setup run --rm bootstrap
          docker compose restart sing-box xray >/dev/null 2>&1 || true
          sudo chown -R "$USER" configs state outputs 2>/dev/null || true
          bash tests/assert-users-reconciled.sh
          sleep 10

      - name: Assert the admin panel serves TLS only
        run: |
          # The panel accepts an HTTP-Basic credential (same secret as Grafana) and
          # manages provisioning, on a published port. It used to fall back to
          # plain HTTP whenever certbot had not succeeded. This asserts the
          # end-to-end result rather than grepping logs: HTTPS must work, and a
          # plain-HTTP request must NOT be served.
          PORT="${PORT_ADMIN:-9443}"
          echo "::group::admin TLS probe on :$PORT"
          # -k because a self-signed fallback is legitimate here; we are testing
          # that TLS is spoken at all, not that the chain is trusted.
          # No `|| echo 000`: curl's %{http_code} ALREADY emits 000 when the
          # connection fails, so the fallback appended a second one and produced
          # "000000". The numeric guard below still behaved (000000 evaluates to
          # 0) but only by luck, and the reported code was nonsense.
          code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "https://127.0.0.1:$PORT/") || true
          echo "https -> $code"
          # A TLS-only listener cannot answer a cleartext request. curl reports 000
          # (or a non-2xx/3xx) rather than a served page.
          plain=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:$PORT/") || true
          echo "http  -> $plain"
          # Which certificate did it bind? Informational, but this is exactly what
          # was invisible before: a domain install must prefer Let's Encrypt.
          subject=$(echo | openssl s_client -connect "127.0.0.1:$PORT" -servername "${MOAV_DOMAIN:-localhost}" 2>/dev/null \
                    | openssl x509 -noout -subject -issuer 2>/dev/null || true)
          echo "cert: ${subject:-<could not read>}"
          echo "::endgroup::"

          # 401 is the expected answer: the panel is up and demanding auth.
          case "$code" in
            2*|3*|401) echo "admin answers over HTTPS (code $code)" ;;
            *) echo "::error::admin did not answer over HTTPS (code $code) - TLS may not be bound"; exit 1 ;;
          esac
          if [ -n "$plain" ] && [ "$plain" != "000" ] && [ "$plain" -ge 200 ] && [ "$plain" -lt 400 ]; then
            echo "::error::admin served a PLAINTEXT request (code $plain) - the TLS-only guarantee is broken"
            exit 1
          fi
          echo "admin refuses plain HTTP as expected (code $plain)"

      - name: Exercise `moav regenerate-users` (the command, not just bootstrap's reconcile)
        run: |
          # The sprint's worst bug lived exactly here (every user FAILED when
          # ENABLE_REALITY=false) and the command itself had never been run by
          # any test — only bootstrap's internal reconcile was exercised.
          ./moav.sh regenerate-users
          sudo chown -R "$USER" configs state outputs 2>/dev/null || true
          bash tests/assert-users-reconciled.sh
          # Every regenerated guide must come back fully rendered.
          bad=0
          for b in outputs/bundles/*/README.html; do
            [ -f "$b" ] || continue
            left=$(grep -oE '\{\{[A-Z0-9_]+\}\}' "$b" | sort -u | tr '\n' ' ')
            if [ -n "$left" ]; then echo "::error::unrendered placeholders in $b after regenerate-users: $left"; bad=1; fi
          done
          [ "$bad" -eq 0 ]

      - name: Protocol gating — normal add, disabled protocols, donate mode (CLI + dashboard)
        run: |
          # Two user reports live here: bundles carrying protocols the operator
          # disabled, and donate mode handing recipients the operator's full set.
          # The dashboard path is asserted too -- admin/main.py runs the same
          # script with DONATE_ONLY_PROTOCOLS in the environment, and that is the
          # path the MahsaNet donation uses and where donate mode was a no-op.
          #
          # Expectations are DERIVED, not hardcoded: a domainless run disables the
          # cert-bearing protocols, so asserting trojan/hysteria2/trusttunnel are
          # present would fail for want of a domain and read as a regression.
          set -u
          fails=0
          have() { [ -e "outputs/bundles/$1/$2" ]; }
          want() { u=$1; shift; for f in "$@"; do have "$u" "$f" || { echo "::error::$u: $f missing (should be present)"; fails=$((fails+1)); }; done; }
          deny() { u=$1; shift; for f in "$@"; do ! have "$u" "$f" || { echo "::error::$u: $f present (should be absent)"; fails=$((fails+1)); }; done; }
          own()  { sudo chown -R "$USER" configs state outputs 2>/dev/null || true; }

          cp .env /tmp/e2e-env.bak
          trap 'cp /tmp/e2e-env.bak .env' EXIT

          HAVE_DOMAIN=no; grep -qE '^DOMAIN=.+' .env && HAVE_DOMAIN=yes
          flagval() { v=$(grep -E "^ENABLE_$1=" .env | tail -1 | cut -d= -f2- | tr -d '"'); echo "${v:-true}"; }
          # Protocols that cannot be issued without a domain (they need a cert).
          needs_domain() { case "$1" in TROJAN|ANYTLS|HYSTERIA2|TRUSTTUNNEL) return 0 ;; *) return 1 ;; esac; }
          # Is this protocol expected in a normal bundle right now?
          expected() {
            [ "$(flagval "$1")" = "true" ] || return 1
            needs_domain "$1" && [ "$HAVE_DOMAIN" = "no" ] && return 1
            return 0
          }
          echo "domain present: $HAVE_DOMAIN"

          # flag:artifact pairs, checked in whichever direction the config implies
          PAIRS="REALITY:reality.txt TROJAN:trojan.txt HYSTERIA2:hysteria2.txt \
                 SS:shadowsocks.txt SNELL:snell.txt XHTTP:xhttp-vless.txt TRUSTTUNNEL:trusttunnel.toml \
                 TELEMT:telegram-proxy-link.txt"

          # --- 1. a normal add matches the configuration, both ways -------------
          ./moav.sh user add gate-normal; own
          for pair in $PAIRS; do
            fl=${pair%%:*}; art=${pair#*:}
            if expected "$fl"; then want gate-normal "$art"; else deny gate-normal "$art"; fi
          done

          # --- 2. turning two off must remove them ------------------------------
          # Pick protocols that are actually ON right now, or the assertion is
          # hollow: a domainless run already has trojan/hysteria2 disabled.
          OFF=""
          for c in TROJAN HYSTERIA2 SS XHTTP; do
            expected "$c" && OFF="$OFF $c"
            [ "$(echo $OFF | wc -w)" -ge 2 ] && break
          done
          if [ -n "$OFF" ]; then
            echo "disabling:$OFF"
            for c in $OFF; do
              grep -q "^ENABLE_$c=" .env && sed -i "s/^ENABLE_$c=.*/ENABLE_$c=false/" .env || echo "ENABLE_$c=false" >> .env
            done
            ./moav.sh user add gate-off; own
            # QR names are not derivable from the config name: xhttp-vless.txt's QR
            # is xhttp-qr.png, so a derived "xhttp-vless-qr.png" would be a
            # vacuous assert that always passes.
            qr_for() { case "$1" in
                TROJAN) echo trojan-qr.png ;; HYSTERIA2) echo hysteria2-qr.png ;;
                SS) echo shadowsocks-qr.png ;; XHTTP) echo xhttp-qr.png ;;
                *) echo "" ;; esac; }
            for c in $OFF; do
              for pair in $PAIRS; do
                [ "${pair%%:*}" = "$c" ] || continue
                deny gate-off "${pair#*:}"
                q=$(qr_for "$c"); [ -n "$q" ] && deny gate-off "$q"
              done
            done
            # converse: a gate that hid everything must still fail this
            want gate-off reality.txt
            sub=$(base64 -d outputs/bundles/gate-off/subscription.txt 2>/dev/null || true)
            for c in $OFF; do
              case "$c" in
                TROJAN)    printf '%s' "$sub" | grep -q '^trojan://'    && { echo "::error::subscription still advertises trojan"; fails=$((fails+1)); } ;;
                HYSTERIA2) printf '%s' "$sub" | grep -q '^hysteria2://' && { echo "::error::subscription still advertises hysteria2"; fails=$((fails+1)); } ;;
                SS)        printf '%s' "$sub" | grep -q '^ss://'        && { echo "::error::subscription still advertises shadowsocks"; fails=$((fails+1)); } ;;
              esac
            done
            cp /tmp/e2e-env.bak .env
          else
            echo "::warning::no toggleable protocol was enabled — skipped the disable check"
          fi

          # --- 3 & 4. donate mode, via the CLI and via the DASHBOARD path -------
          # Donate only what this server can actually issue, so the expectations
          # hold in both modes.
          DONATE="reality"; expected HYSTERIA2 && DONATE="$DONATE hysteria2"
          expected XHTTP && DONATE="$DONATE xhttp"
          echo "donating: $DONATE"

          DONATE_ONLY_PROTOCOLS="$DONATE" ./moav.sh user add gate-donate; own
          docker compose exec -T -w /project \
            -e DONATE_ONLY_PROTOCOLS="$DONATE" \
            admin bash scripts/user-add.sh gate-dash; own

          for u in gate-donate gate-dash; do
            for tok in $DONATE; do
              case "$tok" in
                reality)   want "$u" reality.txt ;;
                hysteria2) want "$u" hysteria2.txt ;;
                xhttp)     want "$u" xhttp-vless.txt ;;
              esac
            done
            # Never donatable, whatever the server runs.
            deny "$u" trusttunnel.toml trusttunnel.json masterdns-client_config.toml \
                      xdns-config.json slipstream-client.conf dnstt-server.pub \
                      telegram-proxy-link.txt cdn-vless.txt
            for w in moav-*-wg.conf moav-*-awg.conf; do
              if compgen -G "outputs/bundles/$u/$w" >/dev/null; then
                echo "::error::$u: $w present (the WireGuard family is never donated)"; fails=$((fails+1))
              fi
            done
            # The subscription must carry exactly the donated protocols.
            n=$(base64 -d "outputs/bundles/$u/subscription.txt" 2>/dev/null | grep -c '://' || true)
            exp=$(echo $DONATE | wc -w)
            [ "$n" -eq "$exp" ] || { echo "::error::$u: subscription has $n entries, expected $exp"; fails=$((fails+1)); }
          done

          for u in gate-normal gate-off gate-donate gate-dash; do
            ./moav.sh user revoke "$u" >/dev/null 2>&1 || true
            rm -rf "outputs/bundles/$u" "state/users/$u"
          done
          [ "$fails" -eq 0 ]

      - name: CDN toggle — off then on, same server (ENABLE_CDN)
        run: |
          # The flip both ways on one server, which the static truth table cannot
          # prove: CDN used to be implied by CDN_SUBDOMAIN being non-empty, so a
          # fresh install generated CDN links whether or not Cloudflare was set
          # up. The disabled->ENABLED direction matters as much as the reverse --
          # an over-eager gate would pass a test that only checks "absent".
          set -u
          fails=0
          # CDN derives its host from CDN_SUBDOMAIN + DOMAIN, so the ON half cannot
          # produce a link without a domain. Skip rather than assert: the OFF half
          # alone would pass for the wrong reason (no domain, not the gate).
          if ! grep -qE '^DOMAIN=.+' .env; then
            echo "no DOMAIN in .env (domainless run) — CDN toggle check not applicable"
            exit 0
          fi

          cp .env /tmp/e2e-cdn-env.bak
          trap 'cp /tmp/e2e-cdn-env.bak .env' EXIT
          own() { sudo chown -R "$USER" configs state outputs 2>/dev/null || true; }

          setflag() {  # <true|false>
            if grep -q '^ENABLE_CDN=' .env; then
              sed -i "s/^ENABLE_CDN=.*/ENABLE_CDN=$1/" .env
            else
              echo "ENABLE_CDN=$1" >> .env
            fi
          }

          # --- OFF: no CDN artifacts, and nothing else lost --------------------
          setflag false
          ./moav.sh user add cdn-off; own
          for f in cdn-vless.txt cdn-vless-qr.png; do
            if [ -e "outputs/bundles/cdn-off/$f" ]; then
              echo "::error::cdn-off: $f present with ENABLE_CDN=false"; fails=$((fails+1))
            fi
          done
          if base64 -d outputs/bundles/cdn-off/subscription.txt 2>/dev/null | grep -q 'type=ws'; then
            echo "::error::cdn-off: subscription still carries the CDN entry"; fails=$((fails+1))
          fi
          # The gate must not take anything else with it.
          for f in reality.txt subscription.txt README.html; do
            [ -s "outputs/bundles/cdn-off/$f" ] || { echo "::error::cdn-off: $f missing — the CDN gate broke an unrelated protocol"; fails=$((fails+1)); }
          done
          # The guide must hide the CDN section rather than show an empty one.
          if grep -q 'id="cdn-en" style=""' outputs/bundles/cdn-off/README.html; then
            echo "::error::cdn-off: guide shows the CDN section with no CDN config"; fails=$((fails+1))
          fi

          # --- ON: the same server now produces them ---------------------------
          setflag true
          ./moav.sh user add cdn-on; own
          for f in cdn-vless.txt; do
            [ -s "outputs/bundles/cdn-on/$f" ] || { echo "::error::cdn-on: $f missing with ENABLE_CDN=true"; fails=$((fails+1)); }
          done
          grep -q '^vless://' outputs/bundles/cdn-on/cdn-vless.txt \
            || { echo "::error::cdn-on: cdn-vless.txt is not a vless link"; fails=$((fails+1)); }
          if ! grep -q 'id="cdn-en" style=""' outputs/bundles/cdn-on/README.html; then
            echo "::error::cdn-on: guide hides the CDN section although the config is present"; fails=$((fails+1))
          fi

          # --- doctor must follow the flag, not the subdomain -------------------
          setflag false
          ./moav.sh doctor dns 2>&1 | grep -q 'CDN check skipped' \
            || { echo "::error::doctor still checks CDN with ENABLE_CDN=false"; fails=$((fails+1)); }

          for u in cdn-off cdn-on; do
            ./moav.sh user revoke "$u" >/dev/null 2>&1 || true
            rm -rf "outputs/bundles/$u" "state/users/$u"
          done
          [ "$fails" -eq 0 ]

      - name: Toggle flip across the three generation code paths
        run: |
          # CDN and the sing-box protocols are flipped elsewhere. These three each
          # go through DIFFERENT code, which is why they are worth their own pass:
          #   xhttp        -> scripts/lib/xray.sh   (via singbox-user-add.sh)
          #   MasterDNS    -> user-add.sh's own DNS-family blocks
          #   WireGuard    -> wg-user-add.sh
          # Two adds, not six: one with all three off, one with all three on. That
          # still exercises both directions per protocol at a third of the cost,
          # and each assertion names its own file so a failure is unambiguous.
          set -u
          fails=0
          own() { sudo chown -R "$USER" configs state outputs 2>/dev/null || true; }
          setflag() {  # <NAME> <true|false>
            if grep -q "^ENABLE_$1=" .env; then sed -i "s/^ENABLE_$1=.*/ENABLE_$1=$2/" .env
            else echo "ENABLE_$1=$2" >> .env; fi
          }
          # present <user> <glob>  /  absent <user> <glob>
          present() { if ! compgen -G "outputs/bundles/$1/$2" >/dev/null; then echo "::error::$1: $2 missing (protocol is enabled)"; fails=$((fails+1)); fi; }
          absent()  { if   compgen -G "outputs/bundles/$1/$2" >/dev/null; then echo "::error::$1: $2 present (protocol is disabled)"; fails=$((fails+1)); fi; }

          cp .env /tmp/e2e-flip-env.bak
          trap 'cp /tmp/e2e-flip-env.bak .env' EXIT

          # MasterDNS derives its host from $DOMAIN, and the domainless prep
          # disables it, so a domainless run must not assert it comes back --
          # that would fail for want of a domain and read as a regression.
          FLIP="XHTTP WIREGUARD"
          [ -n "$(grep -E '^DOMAIN=.+' .env || true)" ] && FLIP="$FLIP MASTERDNS"
          echo "flipping: $FLIP"

          # --- all OFF ----------------------------------------------------------
          for p in $FLIP; do setflag "$p" false; done
          ./moav.sh user add flip-off; own
          absent flip-off 'xhttp-vless.txt'
          absent flip-off 'xhttp-qr.png'
          absent flip-off 'moav-*-wg.conf'
          absent flip-off 'wireguard-qr.png'
          case " $FLIP " in *" MASTERDNS "*) absent flip-off 'masterdns-client_config.toml' ;; esac
          # An over-broad gate must not take the rest of the bundle with it.
          present flip-off 'reality.txt'
          present flip-off 'README.html'
          present flip-off 'subscription.txt'

          # --- all ON, same server ---------------------------------------------
          for p in $FLIP; do setflag "$p" true; done
          ./moav.sh user add flip-on; own
          present flip-on 'xhttp-vless.txt'
          present flip-on 'moav-*-wg.conf'
          case " $FLIP " in *" MASTERDNS "*) present flip-on 'masterdns-client_config.toml' ;; esac
          # The guide must follow the artifacts in both directions.
          for pair in "xhttp:flip-on::flip-off" "wireguard:flip-on::flip-off"; do
            sec="${pair%%:*}"
            if ! grep -q "id=\"${sec}-en\" style=\"\"" "outputs/bundles/flip-on/README.html"; then
              echo "::error::flip-on: guide hides the $sec section although its config is present"; fails=$((fails+1))
            fi
            if ! grep -q "id=\"${sec}-en\" style=\"display:none\"" "outputs/bundles/flip-off/README.html"; then
              echo "::error::flip-off: guide shows the $sec section with no config"; fails=$((fails+1))
            fi
          done

          for u in flip-off flip-on; do
            ./moav.sh user revoke "$u" >/dev/null 2>&1 || true
            rm -rf "outputs/bundles/$u" "state/users/$u"
          done
          [ "$fails" -eq 0 ]

      - name: Run connectivity tests
        run: |
          set -o pipefail
          FLAG=""
          [ "${{ inputs.verbose }}" = "true" ] && FLAG="-v"
          # stdout may interleave logs with the JSON object; keep the raw run and
          # extract the JSON block for evaluation.
          ./moav.sh test e2e-test --json $FLAG | tee e2e-raw.txt
          awk '/^{/{p=1} p{print}' e2e-raw.txt > e2e-results.json
          # Fail LOUD if we didn't get a real result set (missing bundle, moav
          # test crashed, empty JSON) — a green run that tested nothing is worse
          # than a red one.
          count=$(jq '.tests | length' e2e-results.json 2>/dev/null || echo 0)
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::no protocol results produced — bundle missing or 'moav test' errored"
            cat e2e-raw.txt | tail -20
            exit 1
          fi
          echo "Collected $count protocol results."

      - name: Evaluate results
        run: |
          jq -r '.tests | to_entries[] | "  \(.key): \(.value.status)"' e2e-results.json
          fails=$(jq '[.tests[] | select(.status=="fail")] | length' e2e-results.json)
          fails=${fails:-1}   # empty => treat as failure, never as "0 failures"
          echo "Failed protocols: $fails"
          if [ "$fails" -ne 0 ]; then
            echo "::error::e2e connectivity test failed for $fails protocol(s)"
            exit 1
          fi
          # HOLLOW-RUN GUARD. `skip` never counted as failure, so a broken bootstrap
          # that left every protocol unconfigured produced all-skip and passed green,
          # testing nothing. That shipped once and is why this guard exists. Require the
          # core sing-box protocols that run in EVERY domain pass to actually PASS;
          # reality+ss also run in the domainless pass, so gate the domain-only ones on
          # DOMAIN.
          require_pass() {
            local p="$1"
            local st=$(jq -r --arg p "$p" '.tests[$p].status // "absent"' e2e-results.json)
            if [ "$st" != "pass" ]; then
              echo "::error::core protocol '$p' did not pass (status: $st) — a fresh install that can't stand up $p is not a passing install"
              return 1
            fi
            echo "core protocol '$p': pass"
          }
          bad=0
          require_pass reality      || bad=1
          require_pass shadowsocks  || bad=1
          # DOMAIN set => the cert-bearing protocols must work too.
          DOMAIN_VAL=$(grep -E '^DOMAIN=' .env | cut -d= -f2- | tr -d '"')
          if [ -n "$DOMAIN_VAL" ]; then
            require_pass trojan     || bad=1
            require_pass hysteria2  || bad=1
          fi
          # Absolute floor regardless of which protocols are on: a real run
          # produces several live passes, never just readme.
          passes=$(jq '[.tests[] | select(.status=="pass")] | length' e2e-results.json)
          echo "Total protocols passing live: $passes"
          if [ "${passes:-0}" -lt 3 ]; then
            echo "::error::only ${passes:-0} protocol(s) passed — the bundle is empty or the stack never came up (hollow run)"
            bad=1
          fi
          [ "$bad" -eq 0 ]

      - name: CLI smoke test
        run: bash tests/cli-smoke-test.sh

      - name: Full/Mega — domainless pass (after the domain run)
        # full + mega run domain THEN domainless. Skip if the primary run is
        # already domainless-only (would just repeat it).
        if: (inputs.tier == 'full' || inputs.tier == 'mega') && inputs.domainless_only != true && success()
        env:
          MOAV_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          MOAV_SERVER_IP: ${{ secrets.E2E_SERVER_IP }}
        run: |
          set -o pipefail
          echo "== tear down the domain stack for a clean domainless run =="
          timeout 180 ./moav.sh uninstall --wipe --yes 2>&1 | tail -15 || true
          docker compose --profile all down -v 2>/dev/null || true

          echo "== reconfigure .env for domainless (no DOMAIN; cert/domain protocols off) =="
          cp .env.example .env
          sed -i "s|^DOMAIN=.*|DOMAIN=|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=${MOAV_ADMIN_PASSWORD}|" .env
          [ -n "${MOAV_SERVER_IP:-}" ] && sed -i "s|^SERVER_IP=.*|SERVER_IP=${MOAV_SERVER_IP}|" .env
          for p in TROJAN ANYTLS HYSTERIA2 DNSTT SLIPSTREAM MASTERDNS TRUSTTUNNEL XDNS; do
            sed -i "s|^ENABLE_${p}=.*|ENABLE_${p}=false|" .env
          done
          grep -q '^INITIAL_USERS=' .env && sed -i "s|^INITIAL_USERS=.*|INITIAL_USERS=1|" .env || echo "INITIAL_USERS=1" >> .env
          grep -q '^DEFAULT_PROFILES=' .env && sed -i "s|^DEFAULT_PROFILES=.*|DEFAULT_PROFILES=all|" .env || echo "DEFAULT_PROFILES=all" >> .env
          # Snell is off by default; enable it so e2e exercises the inbound,
          # provisioning, bundle, and the client-test reachability check.
          sed -i "s|^ENABLE_SNELL=.*|ENABLE_SNELL=true|" .env

          echo "== domainless: bootstrap -> start -> user add -> test =="
          ./moav.sh bootstrap --yes
          ./moav.sh start all
          sleep 30
          sudo chown -R "$(id -u):$(id -g)" configs state outputs 2>/dev/null || true
          ./moav.sh user revoke e2e-dl 2>/dev/null || true
          ./moav.sh user add e2e-dl
          ./moav.sh test e2e-dl --json | tee e2e-domainless-raw.txt
          awk '/^{/{p=1} p{print}' e2e-domainless-raw.txt > e2e-domainless.json
          count=$(jq '.tests | length' e2e-domainless.json 2>/dev/null || echo 0)
          [ "${count:-0}" -ge 1 ] || { echo "::error::domainless produced no results"; exit 1; }
          jq -r '.tests | to_entries[] | "  \(.key): \(.value.status)"' e2e-domainless.json
          fails=$(jq '[.tests[] | select(.status=="fail")] | length' e2e-domainless.json); fails=${fails:-1}
          echo "domainless failed protocols: $fails"
          [ "$fails" -eq 0 ] || { echo "::error::domainless: $fails protocol(s) failed"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::docker compose ps"
          docker compose --profile all ps 2>&1 || true
          echo "::endgroup::"
          echo "::group::certbot log (cert issuance — the usual first-failure)"
          docker compose --profile all logs --no-color --tail 120 certbot 2>&1 || true
          echo "::endgroup::"
          # Full logs to an artifact for anything else that crash-looped
          docker compose --profile all logs --no-color 2>&1 > compose-logs.txt || true
          echo "=== hint: 'certbot ... exit 1' almost always means the DOMAIN's" \
               "A record doesn't point here yet, port 80 is closed, or the record" \
               "is Cloudflare-proxied (must be DNS-only for HTTP-01)."

      - name: Upload results + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            e2e-raw.txt
            e2e-domainless.json
            e2e-domainless-raw.txt
            compose-logs.txt
          if-no-files-found: warn

      - name: Teardown — exercise `moav uninstall`
        if: always()
        run: |
          ./moav.sh stop 2>/dev/null || true
          # The cert volume is ALWAYS preserved across runs — Let's Encrypt allows
          # only 5 issuances per 168h per domain, so the cert is reused, not
          # reissued. fresh_cert refreshes it at Clean slate and we keep the new
          # one here. Exercise `moav uninstall` for the container/network teardown,
          # then wipe state and other volumes on the destructive tiers so the next
          # run bootstraps clean (Clean slate repeats this at the START). timeout
          # guards a hang.
          IMG=""; [ "$E2E_TIER" = "mega" ] && IMG="--remove-images"
          echo "== moav uninstall --yes $IMG (cert volume kept) =="
          timeout 300 ./moav.sh uninstall --yes $IMG 2>&1 | tail -25 || echo "::warning::moav uninstall returned non-zero / timed out"
          if [ "$E2E_DOMAINLESS_ONLY" = "true" ] || [ "$E2E_TIER" = "full" ] || [ "$E2E_TIER" = "mega" ]; then
            proj="$(grep -E '^COMPOSE_PROJECT_NAME=' .env | cut -d= -f2)"; proj="${proj:-moav}"
            docker volume ls -q --filter "name=^${proj}_" | grep -v '_certs$' \
              | xargs -r docker volume rm 2>/dev/null || true
            echo "state and other volumes dropped; cert volume kept for reuse"
          fi

      - name: Final cleanup — reclaim workspace
        if: always()
        run: |
          # Domain runs: `down` WITHOUT -v, to keep the moav_certs volume so the
          # next run reuses the LE cert (see Teardown). Domainless / full / mega:
          # -v for a clean slate (no cert to preserve / deliberately destructive).
          if [ "$E2E_DOMAINLESS_ONLY" = "true" ] || [ "$E2E_TIER" = "full" ] || [ "$E2E_TIER" = "mega" ]; then
            docker compose --profile all down -v 2>/dev/null || true
          else
            docker compose --profile all down 2>/dev/null || true
          fi
          # MoaV containers run as root and write into the bind-mounted host
          # dirs (configs/, state/, outputs/), leaving root-owned files the
          # runner user can't delete — the next checkout then fails to clean the
          # workspace (EACCES rmdir). Hand ownership back to the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
