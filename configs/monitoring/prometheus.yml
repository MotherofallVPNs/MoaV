# =============================================================================
# Prometheus Configuration for MoaV Monitoring
# =============================================================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  # Recording rules for lifetime bandwidth totals (survive Conduit restarts).
  # Update configs/monitoring/conduit_lifetime.rules.yml after each restart
  # by running: ./scripts/update-conduit-offsets.sh
  - /etc/prometheus/conduit_lifetime.rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091']

  # Node Exporter - System metrics (CPU, RAM, disk, network)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # sing-box User Exporter (user connection metrics from logs)
  - job_name: 'singbox-users'
    static_configs:
      - targets: ['singbox-exporter:9102']
    scrape_timeout: 10s

  # Xray User Exporter (XHTTP user connection metrics from logs)
  # NOTE: Only available when running with --profile xhttp
  - job_name: 'xray-users'
    static_configs:
      - targets: ['xray-exporter:9103']
    scrape_timeout: 10s

  # WireGuard Exporter - custom exporter using docker exec
  # NOTE: Only available when running with --profile wireguard
  - job_name: 'wireguard'
    static_configs:
      - targets: ['wireguard-exporter:9586']
    scrape_timeout: 10s

  # AmneziaWG Exporter - per-peer traffic metrics
  # NOTE: Only available when running with --profile amneziawg
  - job_name: 'amneziawg'
    static_configs:
      - targets: ['amneziawg-exporter:9587']
    scrape_timeout: 10s

  # Conduit v2 native Prometheus metrics
  # NOTE: Only available when running with --profile conduit
  - job_name: 'conduit'
    static_configs:
      - targets: ['psiphon-conduit:9090']
    scrape_timeout: 10s

  # Snowflake native metrics - the proxy's own /internal/metrics endpoint.
  # NOTE: Only available when running with --profile snowflake
  # Authoritative for per-country connections and connection failures. Its byte
  # and connection counters are IN-MEMORY and reset to zero on every proxy
  # restart, so the cumulative totals come from snowflake-exporter (below).
  - job_name: 'snowflake-proxy'
    metrics_path: /internal/metrics
    # snowflake runs with network_mode: host (it needs the host's NAT behaviour),
    # so it is not on moav_net and has no service DNS name. prometheus already
    # declares host.docker.internal:host-gateway for exactly this case.
    static_configs:
      - targets: ['host.docker.internal:9998']
    scrape_timeout: 10s

  # Snowflake cumulative exporter - lifetime bytes relayed + connections served,
  # parsed from the proxy's persistent summary log so they survive restarts (the
  # native counters above do not). On moav_net, scraped by service DNS name.
  - job_name: 'snowflake-cumulative'
    static_configs:
      - targets: ['snowflake-exporter:9105']
    scrape_timeout: 10s

  # telemt - Telegram MTProxy native Prometheus metrics
  # NOTE: Only available when running with --profile telegram
  # telemt binds its raw metrics endpoint (9090) to loopback with no config to
  # change it, so nothing outside the container can scrape it. telemt telemetry
  # comes through telemt-exporter (below), which reads telemt's API on 9091.
  # A raw-metrics job here would sit permanently DOWN. Per-user telemt panels
  # that need the raw metrics await an upstream metrics bind option.

  # telemt API Exporter - ME pool health, DC stats, upstream quality
  # NOTE: Only available when running with --profile telegram + monitoring
  - job_name: 'telemt-api'
    static_configs:
      - targets: ['telemt-exporter:9104']
    scrape_timeout: 10s
